name: Release

# Fires on a version tag. Publishing uses PyPI trusted publishing (OIDC): no
# API token is stored anywhere. The `pypi` environment and the pending
# publisher on PyPI must exist before the first tag; docs/RELEASING.md walks
# through both.
#
# Every action is pinned to a full commit SHA (the tag it was taken from is in
# the comment): the publish job holds an OIDC token PyPI trusts, and a moved
# tag must not be able to change the code that runs with it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi
      - name: Unit tests
        # A tag is not a test run; nothing is published that fails its suite.
        run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        run: python -m build
      - name: Check the distributions
        run: python -m twine check dist/*
      - name: Smoke test the wheel in a fresh environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --quiet dist/*.whl
          /tmp/smoke/bin/suiteaudit --version
          /tmp/smoke/bin/suiteaudit check tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "See CHANGELOG.md for what changed. Install with: pip install suiteaudit==${TAG#v}"
