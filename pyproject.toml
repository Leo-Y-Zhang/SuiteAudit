[project]
name = "suiteaudit"
version = "0.1.0"
description = "Find the tests that cannot fail. A default-deny verdict on whether a test suite tests anything."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["testing", "static-analysis", "ast", "test-quality", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# No dependencies, and that is a feature rather than an omission: this is meant
# to run in someone else's CI on a codebase nobody here has seen, and every
# dependency is a reason it will not install there. The analysis is Python's
# own ast module.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
suiteaudit = "suiteaudit.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
